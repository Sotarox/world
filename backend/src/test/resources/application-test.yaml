spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
  mail:
    host: localhost
    port: 1025
    username: test
    password: test
# custom properties for world app
custom:
  mail:
    enabled: false
  jwt:
    token:
      secret: test-secret-key
      expiration: 300000
